name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o NegociosCandeleda.zip
      - name: Firma fija
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > firma.jks; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Compilar
        run: gradle assembleDebug --stacktrace
      - name: Nombre del APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NegociosCandeleda.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NegociosCandeleda-apk
          path: NegociosCandeleda.apk
      - name: Publicar enlace de descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: descarga
          name: Negocios Candeleda (última versión)
          files: NegociosCandeleda.apk
          make_latest: true
          
